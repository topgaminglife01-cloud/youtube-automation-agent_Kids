name: Kids YouTube Automation Agent

on:
  schedule:
    - cron: '0 5 * * *'    # 5:00 AM UTC: English Long-form (1 Hour)
    - cron: '0 17 * * *'   # 5:00 PM UTC: Hindi Long-form (1 Hour)
    - cron: '30 9 * * *'   # 9:30 AM UTC: English Short (90s)
    - cron: '30 15 * * *'  # 3:30 PM UTC: Hindi Short (90s)
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Select Video Type'
        required: true
        default: 'long'
        type: choice
        options:
          - long
          - short

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Run Kids Cinematic Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_LANGUAGE: ${{ github.event.schedule == '0 17 * * *' || github.event.schedule == '30 15 * * *' && 'Hindi' || 'English' }}
          IS_SHORT: ${{ github.event.inputs.video_type == 'short' || startsWith(github.event.schedule, '30') && 'true' || 'false' }}
        run: python kids_yt_agent.py
