name: Kids YouTube Automation Agent

on:
  schedule:
    - cron: '0 5 * * *'    # Runs every day at 5:00 AM UTC (English Video)
    - cron: '0 17 * * *'   # Runs every day at 5:00 PM UTC (Hindi Video)
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Run Kids Cinematic Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_LANGUAGE: ${{ github.event.schedule == '0 17 * * *' && 'Hindi' || 'English' }}
        run: python kids_yt_agent.py
